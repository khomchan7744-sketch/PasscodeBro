<style>
:root{--bg:#fff6fb;--card:#fff;--tx:#2b2233;--mu:#7d7189;--pr:#e0559a;--pr2:#8b5cf6;--bd:#f0dbe8;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin:0 0 8px}h1{font-size:26px;font-weight:800}h2{font-size:19px}h3{font-size:16px}
.mu{color:var(--mu);font-size:14px}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-weight:600;cursor:pointer}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.d{background:#dc2626}button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:4px 18px 18px 18px;padding:12px 14px;margin:0 40px 12px 0}
.bub img{max-width:100%;border-radius:12px;display:block;cursor:zoom-in}.bub audio{width:100%}
.gift{width:100%;padding:22px;font-size:17px;background:linear-gradient(135deg,#fb7185,#a78bfa);animation:wob 1.6s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(0)}}
.pop{animation:pop .5s}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.lock{position:sticky;bottom:8px;text-align:center;background:var(--card);border:1px dashed var(--bd);border-radius:14px;padding:10px;color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;text-align:center}
.pc .ph{aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mu)}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .in{padding:8px}.pc b{display:block}.pc a{color:var(--pr);font-size:14px;text-decoration:none}
.badge{display:inline-block;background:var(--pr);color:#fff;border-radius:99px;padding:0 9px;font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.chips button{padding:6px 12px;flex:none}
.sel{outline:3px solid var(--pr2)}
.err{color:#dc2626;font-size:14px}.ok{color:var(--ok);font-size:14px}
.prev img{max-width:100%;border-radius:12px}
.big{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}.big img{max-width:96%;max-height:92%}
</style>
</head>

<script type="module">

/* ===== วางค่าตั้งค่า Firebase ของคุณตรงนี้ (ดูขั้นตอนที่ 3 ในคู่มือ) ===== */

const $app=document.getElementById('app');
function h(t,p,...c){const e=document.createElement(t);for(const k in p||{}){const v=p[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else e[k]=v}for(const x of c.flat())if(x!=null&&x!==false)e.append(x);return e}
let db,auth,usr,owner=false,ready=false,isAdmin=false,accounts=null,settings={},profiles={},gifts=[],me=null,tab='main',adminMode=false,adminOK=false,letter='a',refresh=()=>{},unsubs=[];

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

async function shrink(file,max,q0,limit,sq){const img=await createImageBitmap(file);let sx=0,sy=0,sw=img.width,sh=img.height;if(sq){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s}const r=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*r);c.height=Math.round(sh*r);c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);let q=q0,u;do{u=c.toDataURL('image/jpeg',q);q-=.1}while(u.length>limit&&q>.2);return u.length>limit?null:u}

/* ---------- boot ---------- */
const email=u=>u.toLowerCase()+'@pn.local',ipw=(u,p)=>u==='admin'?String(p).trim():String(p).trim()+'-pn';
const app=initializeApp(firebaseConfig);auth=getAuth(app);const fs=getFirestore(app);
const snap=x=>({id:x.id,exists:x.exists(),data:()=>x.data()});

let subs=[],profSub=null;
function ensureProfiles(){if(profSub)return;profSub=db.collection('profiles').onSnapshot(s=>{profiles={};s.docs.forEach(d=>profiles[d.id]=d.data());refresh()},()=>{})}
onAuthStateChanged(auth,u=>{
  subs.forEach(f=>f());subs=[];unsubs.forEach(f=>f());unsubs=[];profSub&&profSub();profSub=null;
  me=null;isAdmin=false;gifts=[];profiles={};settings={};
  if(u&&u.email){const name=u.email.split('@')[0];
    if(name==='admin')isAdmin=true;
    else{const p=parse(name);if(p){me={u:name,...p};letter=p.code[0];tab='main'}}

      subs.push(db.doc('meta/settings').onSnapshot(s=>{settings=s.exists?s.data():{};refresh()},()=>{}));
      if(me){
        subs.push(db.doc('profiles/'+me.code).onSnapshot(s=>{if(s.exists&&!profSub)profiles[me.code]=s.data()},()=>{}));
        unsubs=[db.collection('gifts').where('code','==',me.code).onSnapshot(s=>{gifts=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);refresh()},()=>{})];
      }
    }
  }
  ready=true;paint()});
function logout(){signOut(auth)}

/* ---------- views ---------- */
function paint(){refresh=()=>{};if(!ready)return;
  if(isAdmin)return $app.replaceChildren(adminView());
  if(!me)return $app.replaceChildren(loginView());
  const isN=me.role==='nong';
  const top=h('div',{class:'top'},h('div',{},h('b',{},(isN?'น้อง ':'พี่ ')+nice(me.code)),h('div',{class:'mu'},me.u)),h('div',{class:'row'},owner&&h('button',{class:'g',onclick:()=>{adminMode=true;paint()}},'แอดมิน'),h('button',{class:'g',onclick:logout},'ออก')));
  const tabs=h('div',{class:'tabs'},h('button',{class:tab==='main'?'':'g',onclick:()=>{tab='main';paint()}},isN?'🎁 ของขวัญ':'💌 ส่งคำใบ้'),h('button',{class:tab==='prof'?'':'g',onclick:()=>{tab='prof';paint()}},'🪪 แนะนำตัว'));
  const body=tab==='main'?(isN?nongView():senpaiView()):profView();
  $app.replaceChildren(top,tabs,body)}

function loginView(){
  const u=h('input',{placeholder:'ชื่อผู้ใช้ เช่น NongA1 หรือ SenpaiA1',autocapitalize:'off',autocomplete:'username'}),p=h('input',{type:'password',placeholder:'รหัสผ่าน',autocomplete:'current-password'}),er=h('div',{class:'err'});

    er.textContent='';try{await signInWithEmailAndPassword(auth,email(un),ipw(un,p.value))}catch(e){er.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'}};

  return h('div',{class:'card',style:'margin-top:8vh'},h('h1',{},'💌 พี่รหัส น้องรหัส'),h('p',{class:'mu'},'ล็อกอินด้วยชื่อผู้ใช้ที่ได้รับ'),u,p,er,h('button',{onclick:go,style:'width:100%'},'เข้าสู่ระบบ'))}

/* น้อง: แชทรับของขวัญ */
function giftBody(g){return g.type==='text'?h('p',{style:'margin:0;white-space:pre-wrap'},g.body):g.type==='image'?h('img',{src:g.body,onclick:()=>{const b=h('div',{class:'big',onclick:()=>b.remove()},h('img',{src:g.body}));document.body.append(b)}}):h('audio',{controls:true,src:g.body})}

  const feed=h('div',{}),sum=h('p',{class:'mu'});
  const draw=()=>{const un=gifts.filter(g=>!g.opened).length;sum.textContent=gifts.length?`ได้รับ ${gifts.length} ของขวัญ · ยังไม่เปิด ${un}`:'';

      const b=h('div',{class:'bub'},h('button',{class:'gift',onclick:async()=>{b.replaceChildren(giftBody(g),date);b.classList.add('pop');try{await db.doc('gifts/'+g.id).update({opened:true,openedAt:Date.now()})}catch(e){}}},'🎁 ของขวัญจากพี่รหัส',h('div',{style:'font-size:13px;font-weight:400'},'แตะเพื่อเปิด')),date);return b});

/* พี่: ส่งคำใบ้ */
let mr=null;

  const dl=settings.deadline?h('p',{class:closed()?'err':'mu'},closed()?'หมดเวลาส่งคำใบ้แล้ว':'ส่งได้ถึง '+fmt(settings.deadline)):null;

          m.start();mr=m;setTimeout(()=>m.state==='recording'&&m.stop(),30000);buildComp()}catch(e){draft.msg='ใช้ไมโครโฟนไม่ได้ ตรวจสอบสิทธิ์ของเบราว์เซอร์';buildComp()}}},mr?'⏹ หยุดอัด':'🎙 เริ่มอัดเสียง (≤30 วิ)');

      try{await db.collection('gifts').add({code:me.code,type:draft.type,body,ts:Date.now(),opened:false});draft.text='';draft.img=null;draft.audio=null;draft.msg='ส่งของขวัญแล้ว 🎁'}catch(e){draft.msg='ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'}buildComp()}},'🎁 ส่งเป็นของขวัญให้น้อง '+nice(me.code));

/* แนะนำตัว */
function profView(){ensureProfiles();
  const wrap=h('div',{}),grid=h('div',{class:'grid'}),chips=h('div',{class:'chips'});

  if(me.role==='senpai'){
    const nm=h('input',{placeholder:'ชื่อ / ชื่อเล่น',value:mine.name||''}),ig=h('input',{placeholder:'ไอจี (ไม่ต้องใส่ @)',value:mine.ig||'',autocapitalize:'off'}),pv=h('div',{class:'prev'},mine.photo&&h('img',{src:mine.photo,style:'width:120px;height:120px;object-fit:cover'})),msg=h('div',{class:'ok'});let photo=mine.photo||null;
    const f=h('input',{type:'file',accept:'image/*',onchange:async()=>{if(!f.files[0])return;const u=await shrink(f.files[0],260,.75,60000,true).catch(()=>null);if(u){photo=u;pv.replaceChildren(h('img',{src:u,style:'width:120px;height:120px;object-fit:cover'}))}else msg.textContent='รูปใหญ่เกินไป'}});

  const draw=()=>{chips.replaceChildren();
    grid.replaceChildren(...(hidden?[]:shuf().map(c=>{const p=profiles[c];return h('div',{class:'pc'+(me.role==='senpai'&&c===me.code?' sel':'')},h('div',{class:'ph'},p&&p.photo?h('img',{src:p.photo}):'?'),h('div',{class:'in'},h('b',{},p.name||'—'),p&&p.ig?h('a',{href:'https://instagram.com/'+encodeURIComponent(p.ig),target:'_blank',rel:'noopener'},'@'+p.ig):h('span',{class:'mu'},'ยังไม่มีไอจี')))})))};

/* แอดมิน */
function adminView(){
  const out=h('textarea',{placeholder:'username,password ต่อบรรทัด เช่น\nNongA1,10001\nSenpaiA1,123456',style:'min-height:140px'}),msg=h('div',{class:'ok'});
  const dt=h('input',{type:'datetime-local'});if(settings.deadline){const d=new Date(settings.deadline-new Date().getTimezoneOffset()*6e4);dt.value=d.toISOString().slice(0,16)}
  const sp=h('input',{type:'checkbox',checked:settings.showProfiles!==false,style:'width:auto;margin-right:8px'});
  const dl=(n,t)=>{const a=h('a',{href:URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'})),download:n});document.body.append(a);a.click();a.remove()};
  const gen=()=>{const rows=[];for(const l of'abcdefghijklmnopqrstuvwxyz')for(let i=1;i<=10;i++)for(const r of['Nong','Senpai'])rows.push(r+l.toUpperCase()+i+','+String(Math.floor(1e5+Math.random()*9e5)));out.value=rows.join('\n');dl('accounts.csv','username,password\n'+rows.join('\n'));msg.textContent='สุ่มรหัสผ่านแล้ว และดาวน์โหลดไฟล์เก็บไว้แล้ว ✓ (ยังไม่ได้สร้างบัญชี กดปุ่มสร้างด้านล่างต่อ)'};
  const create=async()=>{const a2=getAuth(initializeApp(firebaseConfig,'creator'+Date.now()));const lines=out.value.split('\n').map(x=>x.trim()).filter(Boolean).filter(x=>!/^username/i.test(x));let ok=0,skip=0;const bad=[];
    for(const[i,ln]of lines.entries()){const[u,p]=ln.split(',').map(x=>x&&x.trim());if(!u||!p||!parse(u)){bad.push(ln);continue}
      try{await createUserWithEmailAndPassword(a2,email(u),ipw(u,p));ok++;await signOut(a2)}catch(e){if(e.code==='auth/email-already-in-use')skip++;else if(e.code==='auth/too-many-requests'||e.code==='auth/quota-exceeded'){msg.textContent=`หยุดชั่วคราว (ส่งเร็วเกินไป) สร้างแล้ว ${ok} มีอยู่แล้ว ${skip} รอ 10 นาทีแล้วกดสร้างอีกครั้ง`;return}else bad.push(ln+' → '+e.code)}
      msg.textContent=`กำลังสร้าง ${i+1}/${lines.length}…`;await new Promise(r=>setTimeout(r,350))}
    msg.textContent=`เสร็จ: สร้างใหม่ ${ok} · มีอยู่แล้ว ${skip}`+(bad.length?` · มีปัญหา ${bad.length}: `+bad.slice(0,3).join(' | '):'')};
  return h('div',{},h('div',{class:'top'},h('h1',{},'⚙️ แอดมิน'),h('button',{class:'g',onclick:logout},'ออก')),
    h('div',{class:'card'},h('h3',{},'ตั้งค่า'),h('label',{class:'mu'},'ปิดรับคำใบ้เมื่อ'),dt,h('label',{},sp,'ให้น้องดูการ์ดแนะนำตัวได้'),h('div',{},h('button',{onclick:async()=>{await db.doc('meta/settings').set({deadline:dt.value?new Date(dt.value).getTime():null,showProfiles:sp.checked});msg.textContent='บันทึกการตั้งค่าแล้ว ✓'}},'บันทึก'))),
    h('div',{class:'card'},h('h3',{},'สร้างบัญชี'),h('p',{class:'mu'},'ขั้นที่ 1: สุ่มรหัสผ่าน (หรือพิมพ์เองในช่อง) ขั้นที่ 2: กดสร้างบัญชี ถ้าหยุดกลางทางกดซ้ำได้ คนที่มีบัญชีแล้วจะถูกข้าม'),h('button',{class:'g',onclick:gen},'🎲 สุ่มรหัสผ่านครบ 520 บัญชี + ดาวน์โหลด CSV'),out,h('button',{onclick:create},'สร้างบัญชีจากรายการ')),msg)}
</script>
</body>
